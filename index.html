<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Halloween na Nexus Community</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --orange:#ff7417;
    --orange2:#ffb13b;
    --purple:#8e45c7;
    --purple-dark:#180b23;
    --dark:#08040d;
    --card:#171020;
}

html{
    min-height:100%;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    text-align:center;

    background:
        radial-gradient(
            circle at 50% 0%,
            #492052 0%,
            #180b23 38%,
            #050308 85%
        );
}


/* =========================
   FUNDO
========================= */

.sky{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-10;
}


.moon{

    position:absolute;

    width:90px;
    height:90px;

    right:10%;
    top:8%;

    border-radius:50%;

    background:#fff4d0;

    box-shadow:
        0 0 25px #fff5,
        0 0 80px #fff2;

    animation:
        moonFloat 5s
        ease-in-out
        infinite;
}


@keyframes moonFloat{

    50%{
        transform:translateY(8px);
    }

}


.star{

    position:absolute;

    width:3px;
    height:3px;

    background:white;

    border-radius:50%;

    animation:
        twinkle 2s
        infinite
        alternate;
}


@keyframes twinkle{

    from{
        opacity:.2;
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }

}


.bat{

    position:absolute;

    font-size:26px;

    opacity:.65;

    animation:
        batFly 13s
        linear
        infinite;
}


@keyframes batFly{

    0%{
        left:-10%;
        transform:
            translateY(0)
            scale(.8);
    }

    50%{
        transform:
            translateY(-70px)
            scale(1);
    }

    100%{
        left:110%;
        transform:
            translateY(30px)
            scale(.8);
    }

}


.fog{

    position:absolute;

    width:180%;
    height:100px;

    left:-40%;
    bottom:8%;

    border-radius:50%;

    background:#fff1;

    filter:blur(30px);

    animation:
        fogMove 12s
        ease-in-out
        infinite
        alternate;
}


@keyframes fogMove{

    from{
        transform:translateX(-8%);
    }

    to{
        transform:translateX(8%);
    }

}


/* =========================
   ENTRADA
========================= */

.intro{

    position:fixed;

    inset:0;

    z-index:9998;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            #32153d,
            #08040d 70%
        );

    transition:
        opacity .8s,
        visibility .8s;
}


.intro.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


.intro-box{

    padding:30px;

    animation:
        introBox
        1.2s
        ease-out;
}


@keyframes introBox{

    from{
        transform:scale(.6);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}


.intro-pumpkin{

    font-size:95px;

    filter:
        drop-shadow(
            0 0 25px #ff5b00
        );

    animation:
        introPumpkin
        1.8s
        infinite
        ease-in-out;
}


@keyframes introPumpkin{

    50%{
        transform:
            scale(1.08)
            rotate(4deg);
    }

}


.intro h2{

    color:#ff8b27;

    font-size:27px;

    text-shadow:
        0 0 15px #ff4500;
}


.intro p{

    margin-top:10px;

    color:#bdaec3;
}


/* =========================
   HEADER
========================= */

header{

    padding:
        30px
        15px
        15px;
}


.logo{

    display:inline-block;

    font-size:70px;

    filter:
        drop-shadow(
            0 0 20px #ff5500
        );

    animation:
        pumpkinFloat
        3s
        ease-in-out
        infinite;
}


@keyframes pumpkinFloat{

    50%{

        transform:
            rotate(4deg)
            translateY(-9px);

    }

}


h1{

    font-size:
        clamp(
            26px,
            7vw,
            48px
        );

    letter-spacing:2px;

    color:#ff8b27;

    text-shadow:
        0 0 8px #ff5b00,
        0 0 25px #ff3500;
}


.subtitle{

    margin-top:8px;

    color:#cdbbd4;

}


/* =========================
   MENU
========================= */

#menu{

    width:94%;

    max-width:1050px;

    margin:auto;

    padding-bottom:50px;
}


.section-title{

    margin:
        28px
        0
        18px;

    font-size:22px;
}


.section-title span{

    color:var(--orange);
}


.games{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                280px,
                1fr
            )
        );

    gap:22px;
}


.card{

    position:relative;

    overflow:hidden;

    padding:
        28px
        20px;

    min-height:390px;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            #26132fdd,
            #0c0711ee
        );

    border:
        1px solid
        #8d4da555;

    box-shadow:
        0 20px 45px #000b,
        inset 0 1px #ffffff14;

    transition:.3s;
}


.card:hover{

    transform:
        translateY(-8px);

    border-color:
        #ff7417aa;

    box-shadow:
        0 25px 55px #000d,
        0 0 35px #ff650020;
}


.card-icon{

    font-size:82px;

    margin:
        10px
        0
        18px;

    filter:
        drop-shadow(
            0 8px 8px #000
        );

    animation:
        floatIcon
        3s
        ease-in-out
        infinite;
}


@keyframes floatIcon{

    50%{

        transform:
            translateY(-7px)
            rotate(2deg);

    }

}


.card h2{

    color:#ff963e;

    font-size:25px;

    margin-bottom:12px;
}


.card p{

    color:#b9aabd;

    line-height:1.6;

    min-height:70px;
}


/* =========================
   BOTÃO
========================= */

.play{

    position:relative;

    overflow:hidden;

    width:90%;

    margin-top:12px;

    padding:16px;

    border:
        1px solid
        #ffb35a55;

    border-radius:14px;

    color:#fff;

    font-size:17px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff8b20,
            #d43800
        );

    box-shadow:
        0 8px 20px #ff4c0028,
        inset 0 1px #fff4;

    cursor:pointer;

    -webkit-tap-highlight-color:
        transparent;
}


.play:active{

    transform:scale(.97);

}


.play:after{

    content:"";

    position:absolute;

    width:70px;
    height:150%;

    top:-25%;
    left:-100px;

    transform:
        rotate(20deg);

    background:#fff3;

    transition:.5s;
}


.play:hover:after{

    left:120%;

}


.help{

    margin-top:16px;

    padding:14px;

    border-radius:14px;

    background:#05030888;

    border:
        1px solid
        #ffffff0b;

    color:#c7b8cc;

    font-size:13px;

    line-height:1.7;
}


/* =========================
   RANKING
========================= */

#ranking{

    margin-top:30px;

    padding:
        25px
        15px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #191021ee,
            #09050cee
        );

    border:
        1px solid
        #8b4ea455;

    box-shadow:
        0 20px 50px #000b;
}


#ranking h2{

    color:#ff9a43;

    margin-bottom:18px;
}


.rankrow{

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    max-width:600px;

    margin:
        5px
        auto;

    padding:
        12px
        15px;

    border-radius:12px;

    background:#ffffff05;

    border-bottom:
        1px solid
        #ffffff0b;
}


.rankrow:first-child{

    background:
        linear-gradient(
            90deg,
            #ff9d2418,
            #ffffff05
        );

    border:
        1px solid
        #ffae3030;
}


.rank-name{

    text-align:left;
}


.rank-points{

    color:#ffad52;

    font-weight:bold;
}


/* =========================
   JOGO
========================= */

#game{

    display:none;

    width:100%;

    padding:
        10px
        5px
        35px;
}


#title{

    margin:
        8px
        0;

    font-size:27px;

    color:#ff963e;

    text-shadow:
        0 0 15px
        #ff5b00;
}


.info{

    display:inline-block;

    margin:
        8px
        auto
        15px;

    padding:
        9px
        20px;

    border-radius:20px;

    background:#110918cc;

    border:
        1px solid
        #ff741744;

    font-size:21px;

    font-weight:bold;
}


#score{

    color:#ffad52;
}


.arena{

    position:relative;

    width:96%;

    max-width:650px;

    height:510px;

    margin:auto;

    overflow:hidden;

    border-radius:25px;

    border:
        2px solid
        #ff7417;

    box-shadow:
        0 0 30px #ff550022,
        0 20px 50px #000b;

    touch-action:none;

    user-select:none;
}


.pumpkin-bg{

    background:

        radial-gradient(
            circle at 75% 13%,
            #fff8df 0 38px,
            transparent 41px
        ),

        radial-gradient(
            circle at 20% 70%,
            #45204f 0,
            transparent 30%
        ),

        linear-gradient(
            160deg,
            #281332,
            #0b0710 65%,
            #170a15
        );
}


.mole-bg{

    background:

        radial-gradient(
            circle at 75% 12%,
            #fff8df 0 36px,
            transparent 39px
        ),

        linear-gradient(
            #10091b 0%,
            #24142e 40%,
            #382519 41%,
            #21140d 70%,
            #0b0705 100%
        );
}


.mole-bg:after{

    content:
        "🌿     🌿     🌿     🌿";

    position:absolute;

    bottom:25px;

    left:0;

    width:100%;

    font-size:32px;

    opacity:.45;

    pointer-events:none;
}


.mist{

    position:absolute;

    width:180%;

    height:100px;

    left:-40%;

    bottom:55px;

    background:#fff1;

    filter:blur(25px);

    animation:
        fogMove
        9s
        ease-in-out
        infinite
        alternate;

    pointer-events:none;
}


.tree{

    position:absolute;

    bottom:20px;

    font-size:110px;

    opacity:.12;

    pointer-events:none;
}


.t1{
    left:-20px;
}

.t2{
    right:-20px;
}


.ground{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:15px;

    background:#ff6500;

    box-shadow:
        0 0 20px
        #ff6500;

    z-index:2;
}


/* =========================
   OBJETOS
========================= */

.item{

    position:absolute;

    font-size:72px;

    transform:
        translate(
            -50%,
            -50%
        );

    user-select:none;

    touch-action:none;

    z-index:10;

    filter:
        drop-shadow(
            0 8px 6px #000
        );

    cursor:pointer;

    animation:
        spawnItem
        .18s
        ease-out;
}


@keyframes spawnItem{

    from{

        transform:
            translate(
                -50%,
                -50%
            )
            scale(.3);

        opacity:0;

    }

    to{

        transform:
            translate(
                -50%,
                -50%
            )
            scale(1);

        opacity:1;

    }

}


/* =========================
   BURACOS
========================= */

.hole{

    position:absolute;

    width:78px;

    height:43px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse at center,
            #020101 0 50%,
            #160d08 70%,
            transparent 72%
        );

    border:
        3px solid
        #4d3020;

    box-shadow:
        inset 0 5px 10px #000,
        0 4px 5px #0008;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:3;
}


/* =========================
   CONTAGEM
========================= */

#countdown{

    position:absolute;

    inset:0;

    z-index:40;

    display:none;

    align-items:center;

    justify-content:center;

    background:#050208bb;

    font-size:100px;

    font-weight:bold;

    color:#ff8a22;

    text-shadow:
        0 0 15px #ff5b00,
        0 0 50px #ff3c00;
}

  JSON.stringify(ranking)
 );

 renderRanking();

 document.getElementById('gameover')
 .style.display='none';

 back();
}


/* =========================
 RANKING
========================= */

function renderRanking(){

 const box=
 document.getElementById('rank');

 let ranking=
 JSON.parse(
  localStorage.getItem('nexusHalloweenRanking') || '[]'
 );

 if(!ranking.length){

  box.innerHTML=`
   <div class="rankrow">
    <div class="rank-name">
     👻 Nenhuma pontuação ainda
    </div>
    <div class="rank-points">
     ---
    </div>
   </div>
  `;

  return;
 }

 box.innerHTML='';

 ranking.forEach((player,index)=>{

  const row=
  document.createElement('div');

  row.className='rankrow';

  let medal='';

  if(index===0) medal='🥇';
  else if(index===1) medal='🥈';
  else if(index===2) medal='🥉';
  else medal=`${index+1}º`;

  row.innerHTML=`
   <div class="rank-name">
    ${medal} ${escapeHTML(player.name)}
   </div>

   <div class="rank-points">
    ${player.score} pts
   </div>
  `;

  box.appendChild(row);

 });
}


/* =========================
 SEGURANÇA DO NOME
========================= */

function escapeHTML(text){

 const div=
 document.createElement('div');

 div.textContent=text;

 return div.innerHTML;
}


/* =========================
 VOLTAR
========================= */

function back(){

 stopGame();

 document.getElementById('game')
 .style.display='none';

 document.getElementById('menu')
 .style.display='block';

 document.querySelector('header')
 .style.display='block';

 document.getElementById('gameover')
 .style.display='none';

 document.getElementById('countdown')
 .style.display='none';

 document.getElementById('playerName')
 .value='';

 arena
 .querySelectorAll('.item')
 .forEach(x=>x.remove());

 document.getElementById('message')
 .textContent='Prepare-se...';

}


/* =========================
 PARAR JOGO
========================= */

function stopGame(reset=true){

 running=false;

 clearTimeout(moleTimer);
 clearInterval(countTimer);

 moleTimer=null;
 countTimer=null;

 objects.forEach(o=>{

  if(o.el && o.el.parentNode){
   o.el.remove();
  }

 });

 objects=[];

 if(reset){

  document.getElementById('countdown')
  .style.display='none';

 }

}


/* =========================

document.addEventListener(

/* =========================
 GARANTIR QUE O BOTÃO
 FUNCIONE NO CELULAR
========================= */

document.querySelectorAll('.play')
.forEach(button=>{

 button.addEventListener(
  'touchend',
  function(e){

   e.preventDefault();

   const onclick=
   this.getAttribute('onclick');

   if(onclick){

    const match=
    onclick.match(
     /openGame\(['"]([^'"]+)['"]\)/
    );

    if(match){

     openGame(match[1]);

    }

   }

  },
  {passive:false}
 );

});
